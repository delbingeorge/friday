[project]
name = "friday"
version = "0.1.0"
description = "Fast, interruptible, low-cost voice assistant for macOS powered by Claude"
readme = "README.md"
authors = [
    { name = "Delbin George", email = "64653923+delbingeorge@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.12.0",
    "kokoro-onnx>=0.6.1",
    "mlx-whisper>=0.4.3",
    "numpy>=2.5.5",
    "onnxruntime>=1.32.0",
    "parakeet-mlx>=0.7.0",
    "sounddevice>=0.5.6",
    "vosk==0.3.42",
]

[project.scripts]
friday = "friday:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
